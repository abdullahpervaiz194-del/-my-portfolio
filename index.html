  data: T;
  status: number;
  timestamp: string;
  meta?: { page: number; total: number };

  url: string, 
  retries: number = 3
): Promise<ApiResponse<T>> {

function shortestPath(adjList, startNode, targetNode) {
  const queue = [[startNode, [startNode]]];
  const visited = new Set([startNode]);

  while (queue.length > 0) {
    const [current, path] = queue.shift();
    if (current === targetNode) return path;

    for (const neighbor of (adjList[current] || [])) {
      if (!visited.has(neighbor)) {

      }

// Web Audio API Synthesizer for UI sound effects (Zero external assets needed)
class SoundManager {
  constructor() {
    this.enabled = false; // default muted so we don't surprise user, easily toggled with UI switch
    this.ctx = null;
  }

  init() {
    if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  toggle() {
    this.enabled = !this.enabled;
    if (this.enabled) {
      this.init();
      this.playBeep(880, 0.08, 'sine');
    }
    return this.enabled;
  }

  playClick() {
    if (!this.enabled) return;
    this.init();
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(200, this.ctx.currentTime + 0.04);
      gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.04);
    } catch (e) {}
  }

  playKeypress() {
    if (!this.enabled) return;
    this.init();
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      const freq = 350 + Math.random() * 100;
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      gain.gain.setValueAtTime(0.02, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.03);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.03);
    } catch (e) {}
  }

  playBeep(freq = 440, duration = 0.1, type = 'sine') {
    if (!this.enabled) return;
    this.init();
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + duration);
    } catch (e) {}
  }

  playSuccess() {
    if (!this.enabled) return;
    this.init();
    try {
      const now = this.ctx.currentTime;
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + idx * 0.07);
        gain.gain.setValueAtTime(0.04, now + idx * 0.07);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now + idx * 0.07);
        osc.stop(now + idx * 0.07 + 0.12);
      });
    } catch (e) {}
  }
}

function initCanvasBackground(canvasId) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;

  const ctx = canvas.getContext('2d');
  let animationFrameId;
  let width = (canvas.width = window.innerWidth);
  let height = (canvas.height = window.innerHeight);

  const particles = [];
  const particleCount = Math.min(Math.floor((width * height) / 12000), 100);
  const maxDistance = 140;

  const mouse = {
    x: null,
    y: null,
    radius: 180
  };

  window.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  window.addEventListener('mouseleave', () => {
    mouse.x = null;
    mouse.y = null;
  });

  window.addEventListener('resize', () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  });

  class Particle {
    constructor() {
      this.x = Math.random() * width;
      this.y = Math.random() * height;
      this.vx = (Math.random() - 0.5) * 0.7;
      this.vy = (Math.random() - 0.5) * 0.7;
      this.size = Math.random() * 2 + 1;
      this.baseAlpha = Math.random() * 0.4 + 0.2;
      this.alpha = this.baseAlpha;
      // Vibrant cyan, indigo, and violet accents
      const colors = ['rgba(99, 102, 241,', 'rgba(14, 165, 233,', 'rgba(168, 85, 247,'];
      this.color = colors[Math.floor(Math.random() * colors.length)];
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;

      if (this.x < 0 || this.x > width) this.vx *= -1;
      if (this.y < 0 || this.y > height) this.vy *= -1;

      // Mouse interaction
      if (mouse.x !== null && mouse.y !== null) {
        const dx = mouse.x - this.x;
        const dy = mouse.y - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < mouse.radius) {
          const force = (mouse.radius - dist) / mouse.radius;
          const dirX = dx / dist;
          const dirY = dy / dist;
          this.x -= dirX * force * 2;
          this.y -= dirY * force * 2;
          this.alpha = Math.min(this.baseAlpha + force * 0.5, 0.9);
        } else {
          this.alpha = this.baseAlpha;
        }
      }
    }

    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fillStyle = `${this.color} ${this.alpha})`;
      ctx.shadowBlur = 8;
      ctx.shadowColor = `${this.color} 0.5)`;
      ctx.fill();
    }
  }

  for (let i = 0; i < particleCount; i++) {
    particles.push(new Particle());
  }

  function render() {
    ctx.clearRect(0, 0, width, height);

    // Draw connecting lines between particles
    for (let i = 0; i < particles.length; i++) {
      particles[i].update();
      particles[i].draw();

      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < maxDistance) {
          const opacity = (1 - dist / maxDistance) * 0.15;
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(129, 140, 248, ${opacity})`;
          ctx.lineWidth = 0.8;
          ctx.stroke();
        }
      }
    }

    animationFrameId = requestAnimationFrame(render);
  }

  render();

  return () => {
    cancelAnimationFrame(animationFrameId);
  };
}

// Interactive Data Structures & Algorithms Visualizer


function DsaVisualizer() {
  const [array, setArray] = useState([45, 20, 75, 12, 60, 32, 88, 15, 52, 28, 95, 40]);
  const [algorithm, setAlgorithm] = useState("bubble");
  const [comparing, setComparing] = useState([]);
  const [sortedIndices, setSortedIndices] = useState([]);
  const [swapping, setSwapping] = useState([]);
  const [isRunning, setIsRunning] = useState(false);
  const [speed, setSpeed] = useState(120); // ms per step
  const [stats, setStats] = useState({ comparisons: 0, swaps: 0, status: "Ready" });

  const generatorRef = useRef(null);
  const timerRef = useRef(null);

  // Complexity metadata
  const complexities = {
    bubble: {
      name: "Bubble Sort",
      best: "O(N)",
      avg: "O(N²)",
      worst: "O(N²)",
      space: "O(1)",
      desc: "Repeatedly steps through the list, compares adjacent elements and swaps them if they are in the wrong order."
    },
    selection: {
      name: "Selection Sort",
      best: "O(N²)",
      avg: "O(N²)",
      worst: "O(N²)",
      space: "O(1)",
      desc: "Finds the minimum element from the unsorted part and puts it at the beginning. Minimizes swap operations."
    },
    insertion: {
      name: "Insertion Sort",
      best: "O(N)",
      avg: "O(N²)",
      worst: "O(N²)",
      space: "O(1)",
      desc: "Builds the sorted array one item at a time by repeatedly taking the next element and inserting it into its correct position."
    }
  };

  // Generate random array
  const generateNewArray = (size = 14) => {
    stopSorting();
    const newArr = [];
    for (let i = 0; i < size; i++) {
      newArr.push(Math.floor(Math.random() * 85) + 12);
    }
    setArray(newArr);
    setComparing([]);
    setSortedIndices([]);
    setSwapping([]);
    setStats({ comparisons: 0, swaps: 0, status: "Generated new random array" });
    window.soundManager.playClick();
  };

  // Stop / pause
  const stopSorting = () => {
    setIsRunning(false);
    if (timerRef.current) {
      clearInterval(timerRef.current);
      timerRef.current = null;
    }
  };

  // Reset state
  const resetArray = () => {
    generateNewArray(14);
  };

  // Generator for Bubble Sort
  function* bubbleSortGen(arr) {
    const a = [...arr];
    const n = a.length;
    let comparisons = 0;
    let swaps = 0;

    for (let i = 0; i < n - 1; i++) {
      let swapped = false;
      for (let j = 0; j < n - i - 1; j++) {
        comparisons++;
        yield { 
          array: [...a], 
          comparing: [j, j + 1], 
          swapping: [], 
          sorted: a.map((_, idx) => idx >= n - i ? idx : null).filter(x => x !== null),
          stats: { comparisons, swaps, status: `Comparing index ${j} (${a[j]}) and ${j + 1} (${a[j + 1]})` }
        };

        if (a[j] > a[j + 1]) {
          swaps++;
          const temp = a[j];
          a[j] = a[j + 1];
          a[j + 1] = temp;
          swapped = true;

          yield { 
            array: [...a], 
            comparing: [], 
            swapping: [j, j + 1], 
            sorted: a.map((_, idx) => idx >= n - i ? idx : null).filter(x => x !== null),
            stats: { comparisons, swaps, status: `Swapped ${a[j]} and ${a[j + 1]}` }
          };
        }
      }
      if (!swapped) break;
    }

    yield {
      array: [...a],
      comparing: [],
      swapping: [],
      sorted: a.map((_, idx) => idx),
      stats: { comparisons, swaps, status: "Complete! Array is fully sorted." }
    };
  }

  // Generator for Selection Sort
  function* selectionSortGen(arr) {
    const a = [...arr];
    const n = a.length;
    let comparisons = 0;
    let swaps = 0;

    for (let i = 0; i < n; i++) {
      let minIdx = i;
      for (let j = i + 1; j < n; j++) {
        comparisons++;
        yield {
          array: [...a],
          comparing: [minIdx, j],
          swapping: [],
          sorted: a.map((_, idx) => idx < i ? idx : null).filter(x => x !== null),
          stats: { comparisons, swaps, status: `Checking if element at ${j} (${a[j]}) < min at ${minIdx} (${a[minIdx]})` }
        };

        if (a[j] < a[minIdx]) {
          minIdx = j;
        }
      }

      if (minIdx !== i) {
        swaps++;
        const temp = a[i];
        a[i] = a[minIdx];
        a[minIdx] = temp;

        yield {
          array: [...a],
          comparing: [],
          swapping: [i, minIdx],
          sorted: a.map((_, idx) => idx <= i ? idx : null).filter(x => x !== null),
          stats: { comparisons, swaps, status: `Swapped minimum element ${a[i]} into position ${i}` }
        };
      }
    }

    yield {
      array: [...a],
      comparing: [],
      swapping: [],
      sorted: a.map((_, idx) => idx),
      stats: { comparisons, swaps, status: "Complete! Array is fully sorted." }
    };
  }

  // Generator for Insertion Sort
  function* insertionSortGen(arr) {
    const a = [...arr];
    const n = a.length;
    let comparisons = 0;
    let swaps = 0;

    for (let i = 1; i < n; i++) {
      let key = a[i];
      let j = i - 1;

      yield {
        array: [...a],
        comparing: [i],
        swapping: [],
        sorted: a.map((_, idx) => idx < i ? idx : null).filter(x => x !== null),
        stats: { comparisons, swaps, status: `Selected key ${key} at index ${i}` }
      };

      while (j >= 0 && a[j] > key) {
        comparisons++;
        swaps++;
        a[j + 1] = a[j];
        yield {
          array: [...a],
          comparing: [j, j + 1],
          swapping: [j + 1],
          sorted: [],
          stats: { comparisons, swaps, status: `Shifted element ${a[j]} to position ${j + 1}` }
        };
        j = j - 1;
      }
      a[j + 1] = key;
    }

    yield {
      array: [...a],
      comparing: [],
      swapping: [],
      sorted: a.map((_, idx) => idx),
      stats: { comparisons, swaps, status: "Complete! Array is fully sorted." }
    };
  }

  const stepForward = () => {
    if (!generatorRef.current) {
      if (algorithm === "bubble") generatorRef.current = bubbleSortGen(array);
      else if (algorithm === "selection") generatorRef.current = selectionSortGen(array);
      else generatorRef.current = insertionSortGen(array);
    }

    const next = generatorRef.current.next();
    if (!next.done) {
      setArray(next.value.array);
      setComparing(next.value.comparing);
      setSwapping(next.value.swapping);
      setSortedIndices(next.value.sorted);
      setStats(next.value.stats);
      window.soundManager.playKeypress();
    } else {
      stopSorting();
      generatorRef.current = null;
      window.soundManager.playSuccess();
    }
  };

  const togglePlay = () => {
    if (isRunning) {
      stopSorting();
      window.soundManager.playClick();
    } else {
      setIsRunning(true);
      window.soundManager.playClick();
    }
  };

  useEffect(() => {
    if (isRunning) {
      timerRef.current = setInterval(() => {
        stepForward();
      }, speed);
    } else {
      if (timerRef.current) clearInterval(timerRef.current);
    }
    return () => {
      if (timerRef.current) clearInterval(timerRef.current);
    };
  }, [isRunning, speed, array, algorithm]);

  const handleAlgoChange = (algoKey) => {
    stopSorting();
    generatorRef.current = null;
    setAlgorithm(algoKey);
    setComparing([]);
    setSortedIndices([]);
    setSwapping([]);
    setStats({ comparisons: 0, swaps: 0, status: `Selected ${complexities[algoKey].name}` });
    window.soundManager.playClick();
  };

  const currComplexity = complexities[algorithm];

  return (
    <section id="visualizer" className="py-24 relative">
      <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        
        {/* Section Header */}
        <div className="text-center max-w-3xl mx-auto mb-14">

            <Icon name="play" className="w-3.5 h-3.5" />
            <span>Live Interactive Lab</span>
          </div>
          <h2 className="text-3xl sm:text-4xl font-extrabold text-white tracking-tight">
            Data Structures & Algorithms Visualizer
          </h2>
          <p className="text-slate-400 mt-4 text-base leading-relaxed">
            Direct demonstration of 3rd-semester algorithmic knowledge. Interact in real-time, adjust speed, 
            inspect step comparisons, and analyze computational complexities.
          </p>
        </div>

        {/* Visualizer Workbench */}
        <div className="glass-panel rounded-2xl p-6 sm:p-8 border border-white/10 shadow-2xl space-y-6">
          
          {/* Controls Bar */}
          <div className="flex flex-wrap items-center justify-between gap-4 pb-6 border-b border-white/10">
            
            {/* Algorithm Selector Buttons */}
            <div className="flex flex-wrap items-center gap-2 bg-slate-900/80 p-1.5 rounded-xl border border-white/5">
              {Object.keys(complexities).map((key) => (
                <button
                  key={key}
                  onClick={() => handleAlgoChange(key)}
                  className={`px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all ${
                    algorithm === key
                      ? 'bg-gradient-to-r from-indigo-500 to-cyan-500 text-white shadow-md'
                      : 'text-slate-400 hover:text-white'
                  }`}
                >
                  {complexities[key].name}
                </button>
              ))}
            </div>

            {/* Execution Buttons */}
            <div className="flex items-center gap-3">
              <button
                onClick={togglePlay}
                className={`flex items-center gap-1.5 px-4 py-2 rounded-xl text-xs font-semibold shadow-md transition-all ${
                  isRunning 
                    ? 'bg-amber-500/20 border border-amber-500/40 text-amber-300' 
                    : 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-emerald-500/20'
                }`}
              >
                <Icon name={isRunning ? "pause" : "play"} className="w-3.5 h-3.5" />
                <span>{isRunning ? "Pause" : "Play Run"}</span>
              </button>

              <button
                onClick={() => {
                  stopSorting();
                  stepForward();
                }}
                disabled={isRunning}
                className="flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 disabled:opacity-50 text-slate-200 border border-white/10 text-xs font-medium transition-all"
                title="Execute single comparison step"
              >

// Interactive Developer Terminal CLI Component


function Terminal({ isOpen, onClose }) {
  const [history, setHistory] = useState([
    { type: 'system', text: 'Welcome to Tauseef Noor\'s Interactive Terminal [Version 3.2.0-CS3]' },
    { type: 'system', text: 'Type "help" to see available commands or "whoami" to inspect profile.\n' }
  ]);
  const [inputVal, setInputVal] = useState('');
  const [cmdHistory, setCmdHistory] = useState([]);
  const [historyIndex, setHistoryIndex] = useState(-1);
  const [isMatrixMode, setIsMatrixMode] = useState(false);

  const bottomRef = useRef(null);
  const inputRef = useRef(null);

  useEffect(() => {
    if (isOpen && inputRef.current) {
      inputRef.current.focus();
    }
  }, [isOpen]);

  useEffect(() => {
    bottomRef.current?.scrollIntoView({ behavior: 'smooth' });
  }, [history, isMatrixMode]);

  if (!isOpen) return null;

  const handleKeyDown = (e) => {
    window.soundManager.playKeypress();

    if (e.key === 'Enter') {
      const trimmed = inputVal.trim();
      if (!trimmed) return;

      const newHistory = [...history, { type: 'user', text: `$ ${trimmed}` }];
      const cmdKey = trimmed.toLowerCase();

      // Add to command history for arrow navigation
      setCmdHistory((prev) => [...prev, trimmed]);
      setHistoryIndex(-1);

      // Evaluate command
      if (cmdKey === 'clear') {
        setHistory([]);
        setIsMatrixMode(false);
        setInputVal('');
        return;
      } else if (cmdKey === 'matrix') {
        setIsMatrixMode(true);
        newHistory.push({ type: 'output', text: 'Initiating Cyber Matrix Rain... (type "clear" to exit)' });
        window.soundManager.playSuccess();
      } else if (window.PORTFOLIO_DATA.terminalCommands[cmdKey]) {
        newHistory.push({ type: 'output', text: window.PORTFOLIO_DATA.terminalCommands[cmdKey] });
        if (cmdKey === 'sudo hire') window.soundManager.playSuccess();
      } else {
        newHistory.push({ 
          type: 'error', 
          text: `zsh: command not found: ${trimmed}. Type "help" for a list of valid commands.` 
        });
      }

      setHistory(newHistory);
      setInputVal('');
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (cmdHistory.length === 0) return;
      const nextIndex = historyIndex === -1 ? cmdHistory.length - 1 : Math.max(0, historyIndex - 1);
      setHistoryIndex(nextIndex);
      setInputVal(cmdHistory[nextIndex] || '');
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (historyIndex === -1) return;
      const nextIndex = historyIndex + 1;
      if (nextIndex >= cmdHistory.length) {
        setHistoryIndex(-1);
        setInputVal('');
      } else {
        setHistoryIndex(nextIndex);
        setInputVal(cmdHistory[nextIndex]);
      }
    } else if (e.key === 'Tab') {
      e.preventDefault();
      const available = ['help', 'whoami', 'skills', 'projects', 'dsa', 'contact', 'matrix', 'clear', 'sudo hire'];
      const match = available.find(c => c.startsWith(inputVal.toLowerCase().trim()));
      if (match) {
        setInputVal(match);
      }
    }
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6 bg-black/80 backdrop-blur-md animate-fadeIn">
      <div className="glass-panel w-full max-w-4xl h-[80vh] rounded-2xl border border-cyan-500/40 shadow-2xl flex flex-col overflow-hidden animate-scaleUp">
        
        {/* Terminal Header Bar */}
        <div className="flex items-center justify-between px-4 py-3 bg-slate-900/90 border-b border-white/10 select-none">
          <div className="flex items-center gap-2">
            <button
              onClick={() => {
                window.soundManager.playClick();
                onClose();
              }}
              className="w-3.5 h-3.5 rounded-full bg-rose-500/90 hover:bg-rose-600 transition-colors"
              title="Close Terminal"
            ></button>
            <button
              onClick={() => setHistory([])}
              className="w-3.5 h-3.5 rounded-full bg-amber-500/90 hover:bg-amber-600 transition-colors"
              title="Clear Terminal"
            ></button>
            <button
              onClick={() => setIsMatrixMode(!isMatrixMode)}
              className="w-3.5 h-3.5 rounded-full bg-emerald-500/90 hover:bg-emerald-600 transition-colors"
              title="Toggle Matrix Rain"
            ></button>
            <span className="font-mono text-xs text-slate-400 ml-3">
              tauseef@cs3-workstation: ~ (zsh)
            </span>
          </div>

          <div className="flex items-center gap-3">
            <span className="text-[11px] font-mono text-cyan-400 hidden sm:inline-block">
              Interactive Dev CLI
            </span>
            <button
              onClick={() => {
                window.soundManager.playClick();
                onClose();
              }}
              className="p-1 rounded text-slate-400 hover:text-white hover:bg-white/10"
            >
              <Icon name="x" className="w-4 h-4" />
            </button>
          </div>
        </div>

        {/* Terminal Content Area */}
        <div 
          onClick={() => inputRef.current?.focus()}
          className={`flex-1 p-4 sm:p-6 font-mono text-xs sm:text-sm overflow-y-auto space-y-2.5 ${
            isMatrixMode ? 'bg-black text-emerald-400' : 'bg-slate-950 text-slate-200'
          }`}
        >
          {history.map((item, idx) => (
            <div key={idx} className="whitespace-pre-wrap leading-relaxed">
              {item.type === 'user' && (
                <span className="text-cyan-400 font-bold">{item.text}</span>
              )}
              {item.type === 'system' && (
                <span className="text-slate-400">{item.text}</span>
              )}
              {item.type === 'output' && (
                <span className={isMatrixMode ? 'text-emerald-400' : 'text-slate-200'}>
                  {item.text}
                </span>
              )}
              {item.type === 'error' && (
                <span className="text-rose-400">{item.text}</span>
              )}
            </div>
          ))}

          {/* Prompt Line */}
          <div className="flex items-center gap-2 pt-1">
            <span className="text-indigo-400 font-bold">tauseef@cs3</span>
            <span className="text-slate-500">:</span>
            <span className="text-cyan-400 font-bold">~</span>
            <span className="text-slate-300">$</span>
            <input
              ref={inputRef}
              type="text"
              value={inputVal}
              onChange={(e) => setInputVal(e.target.value)}
              onKeyDown={handleKeyDown}
              className="flex-1 bg-transparent outline-none border-none text-slate-100 font-mono focus:ring-0 p-0"
              autoFocus
              spellCheck="false"
            />
          </div>

          <div ref={bottomRef} />
        </div>

        {/* Terminal Footer Quick Buttons */}
        <div className="px-4 py-2 bg-slate-900/80 border-t border-white/10 flex flex-wrap items-center justify-between text-[11px] font-mono text-slate-400 gap-2">
          <div className="flex flex-wrap items-center gap-1.5">
            <span className="text-slate-500">Quick:</span>
            {['whoami', 'skills', 'projects', 'dsa', 'sudo hire', 'clear'].map((cmd) => (
              <button
                key={cmd}
                onClick={() => {
                  setInputVal(cmd);
                  inputRef.current?.focus();
                }}
                className="px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-cyan-300 transition-colors"
              >
                {cmd}
              </button>
            ))}
          </div>
          <span className="text-slate-500 hidden md:inline">
            [Tab]: autocomplete • [↑/↓]: history
          </span>
        </div>

      </div>
    </div>
  );
}

window.Terminal = Terminal;

// Contact Component with Interactive Form Validation and Toast Notifications


function Contact() {
  const [formData, setFormData] = useState({ name: '', email: '', subject: '', message: '' });
  const [errors, setErrors] = useState({});
  const [submitted, setSubmitted] = useState(false);
  const [copiedEmail, setCopiedEmail] = useState(false);
  const [copiedPhone, setCopiedPhone] = useState(false);
  const [isSubmitting, setIsSubmitting] = useState(false);

  const emailAddress = window.PORTFOLIO_DATA.personal.email;
  const phoneNumber = window.PORTFOLIO_DATA.personal.phone || "03199554837";

  const handleCopyEmail = () => {
    navigator.clipboard.writeText(emailAddress);
    window.soundManager.playSuccess();
    setCopiedEmail(true);
    setTimeout(() => setCopiedEmail(false), 2500);
  };

  const handleCopyPhone = () => {
    navigator.clipboard.writeText(phoneNumber);
    window.soundManager.playSuccess();
    setCopiedPhone(true);
    setTimeout(() => setCopiedPhone(false), 2500);
  };

  const validate = () => {
    const errs = {};
    if (!formData.name.trim()) errs.name = "Please enter your name";
    if (!formData.email.trim()) {
      errs.email = "Please enter your email";
    } else if (!/\S+@\S+\.\S+/.test(formData.email)) {
      errs.email = "Please provide a valid email address";
    }
    if (!formData.subject.trim()) errs.subject = "Please enter a subject";
    if (!formData.message.trim() || formData.message.length < 10) {
      errs.message = "Message must be at least 10 characters long";
    }
    setErrors(errs);
    return Object.keys(errs).length === 0;
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    window.soundManager.playClick();

    if (!validate()) {
      window.soundManager.playBeep(240, 0.15, 'sawtooth');
      return;
    }

    setIsSubmitting(true);
    setTimeout(() => {
      setIsSubmitting(false);
      setSubmitted(true);
      window.soundManager.playSuccess();
      setFormData({ name: '', email: '', subject: '', message: '' });
      setTimeout(() => setSubmitted(false), 6000);
    }, 600);
  };

  return (
    <section id="contact" className="py-24 relative">
      <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        
        {/* Section Header */}
        <div className="text-center max-w-3xl mx-auto mb-16">

            <Icon name="mail" className="w-3.5 h-3.5" />
            <span>Get in Touch</span>
          </div>
          <h2 className="text-3xl sm:text-4xl font-extrabold text-white tracking-tight">
            Let's Connect & Collaborate
          </h2>
          <p className="text-slate-400 mt-4 text-base leading-relaxed">

            or algorithmic problem solving? Send a message directly below.

        <div className="grid grid-cols-1 lg:grid-cols-12 gap-10 items-start">
          
          {/* Left Column: Quick Contact & Info Cards */}
          <div className="lg:col-span-5 space-y-6">
            
            {/* Direct Email & Phone Cards */}
            <div className="glass-panel rounded-2xl p-6 border border-white/10 space-y-4">
              <span className="text-xs font-mono text-cyan-400 uppercase tracking-wider">

              </span>
              
              {/* Email Item */}
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-slate-900/80 p-3.5 rounded-xl border border-white/5">
                <div className="flex items-center gap-2.5 overflow-hidden">
                  <Icon name="mail" className="w-4 h-4 text-cyan-400 flex-shrink-0" />
                  <span className="text-xs font-mono text-slate-200 truncate">
                    {emailAddress}
                  </span>
                </div>
                <button

            </div>

            {/* Social Channels Card */}

                Profiles & Coding Hubs
              </span>
              <div className="grid grid-cols-2 gap-3">
                <a
                  href={window.PORTFOLIO_DATA.personal.github}

                <a

                  <Icon name="linkedin" className="w-4 h-4 text-blue-400" />
                  <span>LinkedIn</span>
                </a>

                <a
                  href={window.PORTFOLIO_DATA.personal.leetcode}

                  onClick={() => window.soundManager.playClick()}
                  className="flex items-center gap-2.5 p-3 rounded-xl bg-slate-900/60 hover:bg-slate-800 border border-white/5 hover:border-white/20 text-slate-200 transition-all text-xs font-medium"

                  <Icon name="code" className="w-4 h-4 text-amber-400" />

                </a>

                <div className="flex items-center gap-2.5 p-3 rounded-xl bg-slate-900/60 border border-white/5 text-slate-200 text-xs font-medium">
                  <Icon name="map-pin" className="w-4 h-4 text-rose-400" />
                  <span>Remote / Global</span>
                </div>
              </div>
            </div>

          </div>

          {/* Right Column: Interactive Form */}
          <div className="lg:col-span-7 glass-panel rounded-2xl p-6 sm:p-8 border border-white/10 shadow-xl relative">
            
            {submitted && (
              <div className="mb-6 p-4 rounded-xl bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 text-xs font-mono flex items-center gap-3 animate-fadeIn">
                <Icon name="check-circle" className="w-5 h-5 text-emerald-400 flex-shrink-0" />
                <div>
                  <span className="font-bold">Transmission Received!</span>
                  <p className="text-emerald-200/80 mt-0.5">
                    Thank you for reaching out. Your message has been noted and I will reply promptly!
                  </p>
                </div>
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-4">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-mono text-slate-400 mb-1.5">
                    Your Name <span className="text-rose-400">*</span>
                  </label>
                  <input
                    type="text"
                    placeholder="e.g. Alex Mercer"
                    value={formData.name}
                    onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                    className={`w-full px-4 py-2.5 rounded-xl bg-slate-950 border text-xs text-slate-100 outline-none transition-colors ${
                      errors.name ? 'border-rose-500' : 'border-white/10 focus:border-cyan-500'
                    }`}
                  />
                  {errors.name && (
                    <p className="text-[11px] text-rose-400 mt-1">{errors.name}</p>
                  )}
                </div>

                <div>
                  <label className="block text-xs font-mono text-slate-400 mb-1.5">
                    Your Email <span className="text-rose-400">*</span>
                  </label>
                  <input
                    type="email"
                    placeholder="alex@company.com"
                    value={formData.email}
                    onChange={(e) => setFormData({ ...formData, email: e.target.value })}
                    className={`w-full px-4 py-2.5 rounded-xl bg-slate-950 border text-xs text-slate-100 outline-none transition-colors ${
                      errors.email ? 'border-rose-500' : 'border-white/10 focus:border-cyan-500'
                    }`}
                  />
                  {errors.email && (
                    <p className="text-[11px] text-rose-400 mt-1">{errors.email}</p>
                  )}
                </div>
              </div>

              <div>
                <label className="block text-xs font-mono text-slate-400 mb-1.5">
                  Subject <span className="text-rose-400">*</span>
                </label>
                <input
                  type="text"
                  placeholder="Software Internship / Project Collaboration"
                  value={formData.subject}
                  onChange={(e) => setFormData({ ...formData, subject: e.target.value })}
                  className={`w-full px-4 py-2.5 rounded-xl bg-slate-950 border text-xs text-slate-100 outline-none transition-colors ${
                    errors.subject ? 'border-rose-500' : 'border-white/10 focus:border-cyan-500'
                  }`}
                />
                {errors.subject && (
                  <p className="text-[11px] text-rose-400 mt-1">{errors.subject}</p>
                )}
              </div>

              <div>
                <label className="block text-xs font-mono text-slate-400 mb-1.5">
                  Message <span className="text-rose-400">*</span>
                </label>
                <textarea
                  rows="4"
                  placeholder="Share a brief overview of your team, project, or what you'd like to collaborate on..."
                  value={formData.message}
                  onChange={(e) => setFormData({ ...formData, message: e.target.value })}
                  className={`w-full px-4 py-2.5 rounded-xl bg-slate-950 border text-xs text-slate-100 outline-none transition-colors resize-none ${
                    errors.message ? 'border-rose-500' : 'border-white/10 focus:border-cyan-500'
                  }`}
                ></textarea>
                {errors.message && (
                  <p className="text-[11px] text-rose-400 mt-1">{errors.message}</p>
                )}
              </div>

              <button
                type="submit"
                disabled={isSubmitting}
                className="w-full py-3 rounded-xl bg-gradient-to-r from-indigo-600 via-indigo-500 to-cyan-500 hover:opacity-95 text-white font-semibold text-xs shadow-lg shadow-indigo-500/25 transition-all flex items-center justify-center gap-2"
              >
                <Icon name={isSubmitting ? "loader" : "send"} className={`w-4 h-4 ${isSubmitting ? 'animate-spin' : ''}`} />
                <span>{isSubmitting ? "Transmitting..." : "Send Message"}</span>
              </button>
            </form>

          </div>

        </div>

      </div>
    </section>
  );
}

// --- app.js ---
// Main React Application Root Component


function App() {
  const [isTerminalOpen, setIsTerminalOpen] = useState(false);
  const [soundEnabled, setSoundEnabled] = useState(false);

  // Initialize Canvas constellation and Lucide icons
  useEffect(() => {
    const cleanupCanvas = window.initCanvasBackground ? window.initCanvasBackground("bg-canvas") : null;
    
    // Refresh icons whenever DOM updates
    if (window.lucide) {
      window.lucide.createIcons();
    }

    return () => {
      if (cleanupCanvas) cleanupCanvas();
    };
  }, []);

  // Update lucide icons when modals or state changes
  useEffect(() => {
    if (window.lucide) {
      setTimeout(() => window.lucide.createIcons(), 50);
    }
  }, [isTerminalOpen, soundEnabled]);

  const handleToggleSound = () => {
    const newState = window.soundManager.toggle();
    setSoundEnabled(newState);
  };

  const handleOpenTerminal = () => {
    setIsTerminalOpen(true);
  };

  const handleCloseTerminal = () => {
    setIsTerminalOpen(false);
  };

  return (
    <div className="min-h-screen text-slate-100 relative cyber-grid">
      
      {/* Background Interactive Particle Canvas */}
      <canvas
        id="bg-canvas"
        className="fixed inset-0 pointer-events-auto z-0 opacity-80"
      ></canvas>

      {/* Foreground Content Stack */}
      <div className="relative z-10 flex flex-col">
        {/* Navigation Bar */}
        <Navbar
          soundEnabled={soundEnabled}
          onToggleSound={handleToggleSound}
          onOpenTerminal={handleOpenTerminal}
        />

        {/* Hero Section */}
        <Hero onOpenTerminal={handleOpenTerminal} />

        {/* About Section */}
        <About />

        {/* Skills with Code Peek */}
        <Skills />

        {/* Playable DSA Visualizer Lab */}
        <DsaVisualizer />

        {/* Projects Gallery */}
        <Projects />

        {/* Interactive API Lab */}
        <ApiSandbox />

        {/* Timeline Progression */}
        <Timeline />

        {/* Contact Form */}
        <Contact />

        {/* Footer */}
        <Footer />
      </div>

      {/* Floating Developer CLI Terminal Modal */}
      <Terminal
        isOpen={isTerminalOpen}
        onClose={handleCloseTerminal}
      />

    </div>
  );
}

// Mount the React Application into the DOM
const rootElement = document.getElementById('root');
const root = ReactDOM.createRoot(rootElement);
root.render(<App />);

  </script>
